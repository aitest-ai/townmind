<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小島日常</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
<style>
  :root { --bg:#f3f1ea; --card:#fff; --ink:#2b2b2b; --mute:#6f6f6f; --line:#e1ddd0; --accent:#3f78c9; --ok:#4f9d55; --warn:#c98a1d; --bad:#c9473f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  header { padding:8px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { margin:0; font-size:18px; }
  #clock { font-variant-numeric: tabular-nums; color:#444; background:#f4f7fb; border:1px solid #dbe5f2; border-radius:999px; padding:2px 12px; }
  #packName { color:var(--mute); font-size:13px; }
  main { display:grid; grid-template-columns:minmax(320px, 1fr) 340px; gap:12px; padding:12px; max-width:1400px; margin:0 auto; }
  @media (max-width: 960px) { main { grid-template-columns:1fr; } }
  #stage { position:relative; background:#bfe3f2; border:1px solid var(--line); border-radius:12px; overflow:hidden; aspect-ratio: 4 / 3; min-height:280px; touch-action:none; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud { position:absolute; left:10px; right:10px; bottom:10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .panel h2 { margin:0 0 6px; font-size:15px; }
  .p-text { margin:4px 0; color:#444; }
  .p-stat { display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .p-stat b { font-variant-numeric: tabular-nums; }
  .p-bar { margin:4px 0; } .p-bar .track { height:10px; background:#eee; border-radius:5px; overflow:hidden; } .p-bar i { display:block; height:100%; background:var(--ok); }
  .p-list { list-style:none; margin:4px 0; padding:0; } .p-list li { padding:4px 0; border-top:1px dashed var(--line); } .p-list li:first-child { border-top:none; }
  .p-list small { color:var(--mute); display:block; }
  .p-error { color:var(--bad); background:#fdf0ef; border-radius:8px; padding:6px 8px; }
  .p-buttons { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  button, select, input[type=text] { font:inherit; }
  button { min-height:40px; border:1px solid var(--line); background:#fafafa; border-radius:10px; padding:6px 14px; cursor:pointer; }
  button:hover:not(:disabled) { background:#f0efe8; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .why { display:block; font-size:12px; color:var(--mute); margin:-2px 0 4px; }
  input[type=text], select { width:100%; min-height:40px; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  label.field { display:block; margin:4px 0; font-size:13px; color:#555; }
  #toasts { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; z-index:20; width:min(92vw, 520px); }
  .toast { background:#fff; border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:10px; padding:8px 12px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .toast.warn { border-left-color:var(--warn); } .toast.bad { border-left-color:var(--bad); }
  #log { max-height:180px; overflow:auto; font-size:13px; color:#444; } #log div { padding:2px 0; border-bottom:1px dotted #eee; }
  #fatal { position:fixed; inset:0; background:rgba(243,241,234,.97); z-index:30; display:none; overflow:auto; padding:24px; }
  #fatal .box { max-width:640px; margin:6vh auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px 22px; }
  #fatal h2 { margin-top:0; color:var(--bad); }
  #fatal li { margin:4px 0; }
  #fatal .hint { color:#555; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#456; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1 id="title">小島日常</h1>
  <span id="clock">載入中…</span>
  <span id="packName"></span>
</header>
<main>
  <section>
    <div id="stage">
      <div id="loading">小島準備中…</div>
      <canvas id="view2d"></canvas>
      <div id="hud"></div>
    </div>
    <div class="panel" style="margin-top:10px">
      <h2>事件紀錄</h2>
      <div id="log"></div>
    </div>
  </section>
  <aside id="panels"></aside>
</main>
<div id="toasts" aria-live="polite"></div>
<div id="fatal" role="alertdialog"><div class="box"></div></div>
<script type="module" src="./src/shell/boot.js"></script>
</body>
</html>
